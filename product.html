const U='https://wqfnzahjwlukncxlxdkp.supabase.co',K='sb_publishable__QR4tJ9p5RYOQkIuHkoYKQ_mbDa9tuA',db=window.supabase.createClient(U,K),id=new URLSearchParams(location.search).get('id'),section=new URLSearchParams(location.search).get('section')||'products',esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let p=null,slide=0,selected={},qty=1;const $=id=>document.getElementById(id);function money(v){return Number(v||0).toLocaleString('ar-DZ')+' دج'}function sourceName(v){const s=String(v||'').toLowerCase();if(s.includes('temu'))return 'Temu';if(s.includes('aliexpress')||s.includes('ali express'))return 'AliExpress';if(s.includes('amazon'))return 'Amazon';if(s.includes('ebay'))return 'eBay';if(s.includes('shein'))return 'SHEIN';return v||'المتجر الأصلي'}function sourceIcon(v){const s=String(v||'').toLowerCase();if(s.includes('temu'))return '🛍️';if(s.includes('aliexpress')||s.includes('ali express'))return '🛒';if(s.includes('amazon'))return '📦';if(s.includes('ebay'))return '🛍️';if(s.includes('shein'))return '👗';return '🔗'}function requiredOk(){return (Array.isArray(p.options)?p.options:[]).every(o=>!o.required||selected[o.name])}function cart(){return JSON.parse(localStorage.getItem('fenk_product_cart')||'[]')}function saveCart(a){localStorage.setItem('fenk_product_cart',JSON.stringify(a))}function img(){return Array.isArray(p.image_urls)&&p.image_urls.length?p.image_urls:['assets/marketplace/marketplace-products.png']}function render(){const imgs=img();$('app').innerHTML=`<section class="gallery"><img id="mainImg" src="${esc(imgs[slide])}" alt="${esc(p.title)}"><button class="gbtn prev" aria-label="الصورة التالية" onclick="move(1)">›</button><button class="gbtn next" aria-label="الصورة السابقة" onclick="move(-1)">‹</button><span class="counter">${slide+1} / ${imgs.length}</span></section><section class="info"><div class="share-inline"><button class="share-mini" onclick="shareProduct()">↗ مشاركة</button></div><h1 class="title">${esc(p.title)}</h1><div class="price">${money(p.price_dzd)}${p.original_price?` <span class="old">${money(p.original_price)}</span>`:''}</div><div class="badges">${p.discount_pct>0?`<span class="badge">خصم ${Number(p.discount_pct)}%</span>`:''}<span class="badge">⭐ ${Number(p.rating||0)>0?Number(p.rating).toFixed(1):'جديد'}</span><span class="badge">متوفر: ${Number(p.stock_quantity)}</span>${section==='spare_parts'?`<span class="badge">🚗 قطع غيار${p.part_category?' • '+esc(({engines:'محركات',gearbox:'ناقل الحركة',tires_rims:'إطارات وجنوط',brakes:'فرامل',electrical:'كهرباء',lighting:'إضاءة',cooling:'تبريد',oils_filters:'زيوت وفلاتر',batteries:'بطاريات',body:'هيكل',interior:'داخلية',exhaust:'عادم',other:'أخرى'}[p.part_category]||'') ):''}</span>`:''}</div></section><section class="card"><h2>${section==='spare_parts'?'اختر مواصفات قطعة الغيار':'اختر خيارات المنتج'}</h2>${section==='spare_parts'?'<p style="color:#60736d;line-height:1.7">اختر المواصفات المطلوبة، مثل الأمبير أو المقاس أو توافق السيارة، قبل الشراء.</p>':''}${(p.options||[]).map(o=>`<div class="option"><div class="option-title">${esc(o.name)} ${o.required?'*':''}</div><div class="option-list">${(o.values||[]).map(v=>`<button class="${selected[o.name]===v?'selected':''}" onclick="pick('${esc(o.name)}','${esc(v)}')">${esc(v)}</button>`).join('')}</div></div>`).join('')}<div class="option"><div class="option-title">الكمية</div><div class="qty"><button onclick="changeQty(-1)">−</button><b>${qty}</b><button onclick="changeQty(1)">+</button></div></div></section><section class="card"><h2>وصف المنتج</h2><div class="desc">${esc(p.description||'لا يوجد وصف إضافي.')}</div>${p.source_url?`<div class="source-card"><div class="source-head"><span class="source-icon">${sourceIcon(p.source_platform)}</span><div><b>🔗 مصدر المنتج</b><small>المنتج الأصلي على ${esc(sourceName(p.source_platform))}</small></div></div><a class="source-btn" href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">🔗 مشاهدة المنتج الأصلي ↗</a></div>`:''}</section><div class="actions"><button class="buy" onclick="buyNow()">🛍️ شراء الآن</button><button class="cart" onclick="addCart()">🛒 إضافة إلى السلة</button></div><div id="shareMenu" class="share-menu" onclick="if(event.target===this)closeShareMenu()"><div class="share-sheet"><h3>مشاركة المنتج</h3><div class="share-grid"><button class="share-option" onclick="shareFacebook()">🔵 Facebook</button><button class="share-option" onclick="shareMessenger()">💬 Messenger</button><button class="share-option" onclick="shareWhatsApp()">🟢 WhatsApp</button><button class="share-option" onclick="copyProductLink()">🔗 نسخ رابط المنتج</button><button class="share-option" onclick="nativeShare()">📱 مشاركة من الهاتف</button></div><button class="share-close" onclick="closeShareMenu()">إغلاق</button></div></div>`}function move(d){const n=img().length;slide=(slide+d+n)%n;render()}function pick(k,v){selected[k]=v;render()}function changeQty(d){qty=Math.max(1,Math.min(Number(p.stock_quantity)||1,qty+d));render()}function payload(){if(!requiredOk()){alert('يرجى اختيار جميع الخيارات المطلوبة قبل المتابعة.');return null}return {product_id:p.id,title:p.title,price:p.price_dzd,original_price:p.original_price||null,discount_pct:Number(p.discount_pct||0),quantity:qty,options:selected,image_url:img()[0],catalog_section:section,part_category:p.part_category||null,stock_quantity:Number(p.stock_quantity||0)}}function addCart(){const x=payload();if(!x)return;const a=cart();const key=x.product_id+JSON.stringify(x.options);const old=a.find(i=>i.key===key);if(old)old.quantity=Math.min(Number(p.stock_quantity)||999,old.quantity+x.quantity);else a.push({...x,key});saveCart(a);alert('✓ تمت إضافة المنتج إلى السلة.');location.href='product-cart.html'}function buyNow(){const x=payload();if(!x)return;sessionStorage.setItem('fenk_buy_now',JSON.stringify([x]));location.href='product-checkout.html'}function productUrl(){return new URL('product.html?id='+encodeURIComponent(p.id)+(section&&section!=='products'?'&section='+encodeURIComponent(section):''),location.href).href}function openShareMenu(){const m=$('shareMenu');if(m)m.classList.add('open')}function closeShareMenu(){const m=$('shareMenu');if(m)m.classList.remove('open')}function shareProduct(){openShareMenu()}function shareText(){return 'FENK — '+p.title+'\n'+money(p.price_dzd)+'\n🛍️ تسوق الآن\n'+productUrl()}function shareFacebook(){const url=encodeURIComponent(productUrl());window.open('https://www.facebook.com/sharer/sharer.php?u='+url,'_blank','noopener,noreferrer');closeShareMenu()}function shareMessenger(){const url=encodeURIComponent(productUrl());const appUrl='fb-messenger://share/?link='+url;try{window.location.href=appUrl;setTimeout(()=>{window.open('https://www.messenger.com/','_blank','noopener,noreferrer')},900)}catch(e){window.open('https://www.messenger.com/','_blank','noopener,noreferrer')}closeShareMenu()}function shareWhatsApp(){const text=encodeURIComponent(shareText());window.open('https://wa.me/?text='+text,'_blank','noopener,noreferrer');closeShareMenu()}async function copyProductLink(){const url=productUrl();try{await navigator.clipboard.writeText(url);alert('✓ تم نسخ رابط المنتج.')}catch(e){const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('✓ تم نسخ رابط المنتج.')}closeShareMenu()}async function nativeShare(){const url=productUrl();if(navigator.share){try{await navigator.share({title:'FENK — '+p.title,text:'FENK — '+p.title+'\n'+money(p.price_dzd)+'\n🛍️ تسوق الآن',url})}catch(e){}}else await copyProductLink();closeShareMenu()}async function load(){if(!id)return $('app').textContent='المنتج غير موجود.';const {data,error}=await db.from('fenk_products').select('*').eq('id',id).eq('catalog_section',section).eq('is_active',true).eq('show_in_products',true).single();if(error||!data)return $('app').textContent='المنتج غير متوفر حاليًا.';p=data;const back=$('backCatalog');if(section==='spare_parts'){back.href='spare-parts.html'+(p.part_category?('?part='+encodeURIComponent(p.part_category)):'');back.querySelector('span').textContent='قطع غيار السيارات';document.title='FENK — '+p.title+' | قطع غيار السيارات'}render()}load();
