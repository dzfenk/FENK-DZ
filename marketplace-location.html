const w=document.getElementById('wilaya');Object.keys(coords).forEach(n=>w.add(new Option(n,n)));let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}w.value=saved.wilaya&&coords[saved.wilaya]?saved.wilaya:'الجزائر';document.getElementById('municipality').value=saved.municipality||'';document.querySelector(`input[name=mode][value="${saved.mode||'suggested'}"]`).checked=true;const radii=[1,5,10,25,50,100];document.querySelector('.radii').innerHTML=radii.map(r=>`<label class="radius"><input type="radio" name="radius" value="${r}">${r} كم</label>`).join('');document.querySelector(`input[name=radius][value="${saved.radius_km||5}"]`).checked=true;function refresh(){document.getElementById('current').textContent=w.value;document.getElementById('currentSub').textContent=document.querySelector('input[name=mode]:checked').value==='custom'?`نطاق مخصص: ${document.querySelector('input[name=radius]:checked').value} كم`:'النطاق الجغرافي المقترح'}w.onchange=refresh;document.querySelectorAll('input[name=mode],input[name=radius]').forEach(x=>x.onchange=refresh);refresh();document.getElementById('save').onclick=()=>{const [lat,lng]=coords[w.value];const data={wilaya:w.value,municipality:document.getElementById('municipality').value.trim(),lat,lng,mode:document.querySelector('input[name=mode]:checked').value,radius_km:Number(document.querySelector('input[name=radius]:checked').value)};localStorage.setItem(KEY,JSON.stringify(data));location.href='marketplace-category.html?category=cars'};
