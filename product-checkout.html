<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FENK — تأكيد الطلب</title><link rel="icon" href="assets/logo-clean.webp"><style>body{margin:0;background:#f5faf8;color:#123a3d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:#003d32;color:#fff;padding:14px;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:auto;padding:18px 14px 100px}.card{background:#fff;border:1px solid #dfeae6;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccdcd7;border-radius:11px;font:inherit}.full{grid-column:1/-1}.summary{display:flex;gap:10px;border-bottom:1px solid #edf2f0;padding:10px 0}.summary img{width:70px;height:70px;object-fit:cover;border-radius:10px}.summary .grow{flex:1}.total{font-size:20px;font-weight:950}.pay{background:#f2fbf7;border:1px solid #cce7dc;border-radius:13px;padding:12px;line-height:1.8}.btn{width:100%;border:0;background:#08c879;color:#fff;border-radius:13px;padding:15px;font-weight:950;font-size:17px}.msg{margin-top:10px;font-weight:800}.success{color:#087b56}.error{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>  <link rel="stylesheet" href="fenk-global-share.css?v=1">
</head><body><header class="top"><a href="product-cart.html">← السلة</a><b id="checkoutTitle">FENK — تأكيد الطلب</b><a id="catalogLink" href="products.html">منتجات</a></header><main class="wrap"><h1>🛍️ مراجعة الطلب</h1><div id="items" class="card"></div><div class="card"><h2>معلومات الزبون</h2><form id="form"><div class="grid"><div class="field"><label>الاسم الكامل *</label><input id="name" required></div><div class="field"><label>رقم الهاتف *</label><div style="display:flex;direction:ltr"><span style="display:grid;place-items:center;padding:0 12px;background:#edf7f3;border:1px solid #ccdcd7;border-left:0;border-radius:11px 0 0 11px;font-weight:900;color:#087b56">+213</span><input id="phone" style="border-radius:0 11px 11px 0" inputmode="numeric" placeholder="05xxxxxxxx" required></div></div><div class="field"><label>الولاية *</label><input id="wilaya" required></div><div class="field"><label>البلدية *</label><input id="commune" required></div><div class="field"><label>الرمز البريدي *</label><input id="postal" required></div><div class="field full"><label>العنوان بالتفصيل *</label><textarea id="address" required rows="3" placeholder="الحي، رقم المنزل، الشارع..."></textarea></div></div><h2>طريقة الدفع</h2><div id="payment" class="pay">جارٍ تحميل طرق الدفع…</div><label class="field" style="display:block;margin-top:10px">إثبات الدفع (اختياري إذا كنت ستدفع لاحقًا)<input id="proof" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn" id="submit">🟢 تأكيد الطلب</button><div id="msg" class="msg"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script>const U='https://wqfnzahjwlukncxlxdkp.supabase.co',K='sb_publishable__QR4tJ9p5RYOQkIuHkoYKQ_mbDa9tuA',db=window.supabase.createClient(U,K),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const $=id=>document.getElementById(id);const items=JSON.parse(sessionStorage.getItem('fenk_buy_now')||'[]');const fromCart=sessionStorage.getItem('fenk_checkout_from_cart')==='1';const isParts=items[0]?.catalog_section==='spare_parts';if(isParts){$('checkoutTitle').textContent='FENK — تأكيد طلب قطعة غيار';$('catalogLink').href='spare-parts.html';$('catalogLink').textContent='قطع الغيار'}function money(v){return Number(v||0).toLocaleString('ar-DZ')+' دج'}function render(){if(!items.length){$('items').innerHTML='<div style="text-align:center;padding:28px 10px">السلة فارغة.<br><a href="products.html" style="display:inline-block;margin-top:12px;background:#08c879;color:#fff;text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:900">تصفح المنتجات</a></div>';$('submit').disabled=true;return}let sub=0;$('items').innerHTML=items.map(x=>{sub+=Number(x.price)*Number(x.quantity);return `<div class="summary"><img src="${esc(x.image_url)}"><div class="grow"><b>${esc(x.title)}</b><div>${Object.entries(x.options||{}).map(([k,v])=>esc(k)+': '+esc(v)).join(' • ')}</div><small>الكمية: ${x.quantity} × ${money(x.price)}</small></div><strong>${money(x.price*x.quantity)}</strong></div>`}).join('')+`<div class="total">المجموع: ${money(sub)}<br><small style="font-size:12px;color:#70807b">التوصيل: 0 دج حاليًا — يمكن للإدارة تحديده لاحقًا.</small></div>`}async function payment(){const {data}=await db.from('payment_settings').select('method,display_name,account_number,phone_number,instructions,is_active').eq('is_active',true);const bar=(data||[]).find(x=>x.method==='barid_mob')||data?.[0];$('payment').innerHTML=bar?`<b>${esc(bar.display_name||bar.method)}</b><br>${bar.account_number?`رقم الحساب: ${esc(bar.account_number)}<br>`:''}${bar.phone_number?`الهاتف: ${esc(bar.phone_number)}<br>`:''}${esc(bar.instructions||'يمكنك تأكيد الطلب ثم متابعة الدفع مع FENK.')}`:'يمكنك تأكيد الطلب وسيتم التواصل معك من فريق FENK لتأكيد طريقة الدفع.'}async function submit(e){e.preventDefault();const btn=$('submit');btn.disabled=true;$('msg').textContent='جارٍ إنشاء الطلب…';$('msg').className='msg';try{const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('يجب تسجيل الدخول إلى حساب FENK أولًا.');if(!items.length)throw new Error('السلة فارغة.');const name=$('name').value.trim(),phone=$('phone').value.trim().replace(/\s+/g,''),wilaya=$('wilaya').value.trim(),commune=$('commune').value.trim(),postal=$('postal').value.trim(),address=$('address').value.trim();if(!name||!/^0[567]\d{8}$/.test(phone)||!wilaya||!commune||!postal||!address)throw new Error('أكمل معلومات الزبون، ورقم الهاتف يجب أن يبدأ بـ 05 أو 06 أو 07.');const proof=$('proof').files?.[0];let proofPath=null;if(proof){if(!['image/jpeg','image/png','image/webp'].includes(proof.type)||proof.size>5*1024*1024)throw new Error('إثبات الدفع يجب أن يكون JPG/PNG/WEBP وبحد أقصى 5MB.');const path=`${user.id}/product-payment-${crypto.randomUUID()}.${proof.type.split('/')[1].replace('jpeg','jpg')}`;const up=await db.storage.from('payment-proofs').upload(path,proof,{contentType:proof.type,upsert:false});if(up.error)throw up.error;proofPath=path}let total=items.reduce((s,x)=>s+Number(x.price)*Number(x.quantity),0);const first=items[0];const opts=items.map(x=>({product_id:x.product_id,title:x.title,quantity:x.quantity,options:x.options,price:x.price,catalog_section:x.catalog_section||'products',part_category:x.part_category||null}));const orderNumber='FENK-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase();const payload={user_id:user.id,order_number:orderNumber,order_code:orderNumber.replace('FENK-',''),product_id:first.product_id,customer_name:name,customer_first_name:name.split(/\s+/)[0]||name,customer_last_name:name.split(/\s+/).slice(1).join(' ')||null,customer_phone:'+213'+phone.slice(1),wilaya,commune,address,postal_code:postal,quantity:items.reduce((s,x)=>s+Number(x.quantity),0),product_price:total,shipping_fee:0,service_fee:0,total_price:total,amount_dzd:total,currency:'DZD',product_name:first.title,product_info:JSON.stringify(opts),product_options:opts[0]?.options||{},product_image_url:first.image_url,payment_method:'barid_mob',payment_proof_path:proofPath,payment_info:proofPath?'PROOF_PATH:'+proofPath:null,status:proofPath?'payment_submitted':'received',confirmation_message:'تم استلام طلب منتجات FENK.'};const {data,error}=await db.from('orders').insert(payload).select('id,order_number,order_code').single();if(error)throw error;if(fromCart){const keyOf=x=>x.key||((x.product_id||x.id||x.title||'item')+'::'+JSON.stringify(x.options||{}));const submitted=new Set(items.map(keyOf));const current=JSON.parse(localStorage.getItem('fenk_product_cart')||'[]');localStorage.setItem('fenk_product_cart',JSON.stringify(current.filter(x=>!submitted.has(keyOf(x)))));window.dispatchEvent(new Event('fenk-cart-updated'));}sessionStorage.removeItem('fenk_buy_now');sessionStorage.removeItem('fenk_checkout_from_cart');sessionStorage.removeItem('fenk_cart_selected');$('msg').className='msg success';$('msg').innerHTML=`✅ تم تأكيد طلبك بنجاح<br>رقم الطلب: <b>#${esc(data.order_number||data.order_code||'FENK')}</b><br>سنتواصل معك لتأكيد الطلب والتوصيل.`;$('submit').disabled=true}catch(err){$('msg').className='msg error';$('msg').textContent=err?.message||'تعذر إنشاء الطلب.';btn.disabled=false}}render();payment();$('form').addEventListener('submit',submit);</script>  <script src="fenk-global-share.js?v=1"></script>
