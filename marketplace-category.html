function levenshtein(a,b){if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;const m=Array.from({length:b.length+1},(_,i)=>i);for(let j=1;j<=a.length;j++){let prev=j;for(let i=1;i<=b.length;i++){const cur=m[i];m[i]=Math.min(m[i]+1,m[i-1]+1,prev+(a[j-1]===b[i-1]?0:1));prev=cur}}return prev}

function getRecent(){try{return JSON.parse(localStorage.getItem(FENK_SEARCH_KEY)||'[]').filter(Boolean)}catch{return[]}}
function saveRecent(q){q=String(q||'').trim();if(!q)return;let a=getRecent().filter(x=>normalizeText(x)!==normalizeText(q));a.unshift(q);localStorage.setItem(FENK_SEARCH_KEY,JSON.stringify(a.slice(0,8)));renderRecent()}
function removeRecent(q){localStorage.setItem(FENK_SEARCH_KEY,JSON.stringify(getRecent().filter(x=>x!==q)));renderRecent()}
function renderRecent(){const box=document.getElementById('recentSearchesBox'),list=document.getElementById('recentSearches');if(!box||!list)return;const a=getRecent();box.hidden=!a.length;list.innerHTML=a.map(x=>`<span class="mp-recent-item"><button type="button" data-remove="${esc(x)}" aria-label="حذف">×</button><button type="button" data-run="${esc(x)}" style="border:0;background:transparent;font:inherit;cursor:pointer">${esc(x)}</button></span>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();removeRecent(b.dataset.remove)});list.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{document.getElementById('categorySearch').value=b.dataset.run;saveRecent(b.dataset.run);loadCategory()})}
function readLocation(){try{return JSON.parse(localStorage.getItem(FENK_LOC_KEY)||'{}')}catch{return{}}}
function haversine(a,b){const R=6371,la=(b.lat-a.lat)*Math.PI/180,lo=(b.lng-a.lng)*Math.PI/180,x=Math.sin(la/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function coordForName(name){const n=normalizeText(name).replace(/^ولاية\s*/,'');for(const [k,v] of Object.entries(WILAYA_COORDS)){if(normalizeText(k)===n||normalizeText(k).replace(/^ولاية\s*/,'')===n)return v}return null}
function adPoint(a){const d=a.details&&typeof a.details==='object'?a.details:{};const lat=Number(d.latitude??d.lat??d.location?.lat),lng=Number(d.longitude??d.lng??d.location?.lng);if(Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng,exact:true};return coordForName(a.wilaya)||null}
function locationDistance(a,loc){const p=adPoint(a),center=loc&&Number.isFinite(Number(loc.lat))?{lat:Number(loc.lat),lng:Number(loc.lng)}:WILAYA_COORDS[loc?.wilaya]||WILAYA_COORDS['Alger'];return p&&center?haversine(center,p):null}
function cardMeta(a,loc){const d=a.details&&typeof a.details==='object'?a.details:{};const meta=[];const isCar=d.type==='car'||d.model||d.year;if(isCar){if(d.year)meta.push(`السنة ${esc(d.year)}`);if(d.mileage)meta.push(`${Number(String(d.mileage).replace(/[^0-9]/g,'' )||0).toLocaleString('ar-DZ')} كم`);if(d.fuel)meta.push(esc(d.fuel));if(d.gear)meta.push(esc(d.gear));}else if(a.wilaya||a.municipality||a.commune){meta.push(esc(a.wilaya||a.municipality||a.commune));}else if(d.brand){meta.push(esc(d.brand));}const dist=locationDistance(a,loc);return {meta:meta.slice(0,2).map(x=>`<span>${x}</span>`).join(''),dist:dist!=null?`📍 ${dist<1?'<1':dist.toFixed(0)} كم`:''}}
function renderCard(a,label,cat,loc){const urls=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls:(a.image_url?[a.image_url]:[]);const href=`marketplace-ad.html?id=${encodeURIComponent(a.id)}`;const title=a.title||label;const m=cardMeta(a,loc);const price=a.price_dzd!=null&&Number(a.price_dzd)>0?money(a.price_dzd):'السعر عند التواصل';return `<article class="card category-card category-${esc(cat)}"><a class="market-card-link" href="${href}" aria-label="${esc(title)}">${urls[0]?`<img src="${esc(urls[0])}" alt="${esc(title)}" loading="lazy" onerror="this.closest('.market-card-link').classList.add('no-photo');this.remove()">`:`<div class="card-no-image">📷</div>`}<div class="body"><h3>${esc(title)}</h3>${m.meta?`<div class="market-card-meta">${m.meta}</div>`:''}${m.dist?`<div class="market-card-distance">${m.dist}</div>`:''}<div class="market-card-price ${a.price_dzd==null?'is-contact':''}">${price}</div></div></a></article>`}
function applyLocalFilters(rows,search,loc,cat){const min=Number(document.getElementById('minPrice')?.value||0),maxRaw=document.getElementById('maxPrice')?.value,max=maxRaw===''?Infinity:Number(maxRaw);const mode=loc?.mode||'suggested';const radius=Number(loc?.radius_km||5);return rows.filter(a=>{const text=[a.title,a.description,a.wilaya,a.municipality,a.commune,JSON.stringify(a.details||{})].join(' ');if(search&&!fuzzyMatch(search,text))return false;if(Number(a.price_dzd||0)<min)return false;if(max!==Infinity&&Number(a.price_dzd||0)>max)return false;const dist=locationDistance(a,loc);if(mode==='custom'&&!(dist!=null&&dist<=radius))return false;return true})}
async function loadCategory(){await getUser();const qs=new URLSearchParams(location.search);const cat=qs.get('category')||'products';if(cat==='products'){location.replace('products.html');return;}document.body.classList.toggle('cars-density',cat==='cars');const titles={products:'منتجات',cars:'سواق السيارات',realestate:'عقارات / أراضي',land:'أراضي للبيع',ads:'الإعلانات',spare_parts:'🚗 قطع غيار السيارات'};const partNames={engines:'🔧 محركات',gearbox:'⚙️ ناقل الحركة',tires_rims:'🛞 إطارات وجنوط',brakes:'🛑 فرامل',electrical:'🔌 كهرباء',lighting:'💡 إضاءة',cooling:'❄️ تبريد',oils_filters:'🛢️ زيوت وفلاتر',batteries:'🔋 بطاريات',body:'🚘 هيكل',interior:'🪑 داخلية',exhaust:'💨 عادم',other:'➕ أخرى'};const aliases={tires_rims:['tires_rims','tires'],engines:['engines'],gearbox:['gearbox'],brakes:['brakes'],electrical:['electrical'],lighting:['lighting'],cooling:['cooling'],oils_filters:['oils_filters'],batteries:['batteries'],body:['body'],interior:['interior'],exhaust:['exhaust'],other:['other','suspension']};const part=qs.get('part');const label=cat==='spare_parts'?(partNames[part]||'🚗 قطع غيار السيارات'):(titles[cat]||'منتجات');document.title='FENK — '+label;document.getElementById('categoryHeroTitle').textContent=label;document.getElementById('categoryTitle').textContent=label;document.getElementById('categoryHeroText').textContent=cat==='ads'?'تصفح جميع الإعلانات المنشورة في FENK Marketplace.':(cat==='spare_parts'?'اختر نوع القطعة للوصول بسرعة إلى الإعلانات المناسبة لسيارتك.':'تصفح إعلانات هذا القسم فقط، مع عرض أهم المعلومات بشكل مختصر وواضح.');const loc=readLocation();const locName=loc.wilaya||'الجزائر';document.getElementById('currentLocationName').textContent=locName;document.getElementById('currentRadiusText').textContent=loc.mode==='custom'?`${loc.radius_km||5} كم`:'مقترح';const filterBox=document.getElementById('categoryFilters');if(filterBox){if(cat==='spare_parts'){filterBox.style.display='flex';filterBox.innerHTML='<a class="chip" href="marketplace-category.html?category=spare_parts&part=engines">🔧 محركات</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=gearbox">⚙️ ناقل الحركة</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=tires_rims">🛞 إطارات وجنوط</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=brakes">🛑 فرامل</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=electrical">🔌 كهرباء</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=lighting">💡 إضاءة</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=cooling">❄️ تبريد</a><a class="chip" href="marketplace-category.html?category=spare_parts&part=oils_filters">🛢️ زيوت وفلاتر</a>'; }else if(cat==='cars'||cat==='realestate'||cat==='land'){filterBox.style.display='flex';filterBox.innerHTML='<a class="chip" href="marketplace-location.html">📍 '+esc(locName)+'</a>'; }else filterBox.style.display='none'}
const grid=document.getElementById('grid');let q=db.from('marketplace_ads').select('id,ad_code,user_id,title,description,price_dzd,contact,phone,image_url,image_urls,status,payment_status,start_at,end_at,created_at,category_id,details,wilaya,wilaya_code,commune,municipality').eq('status','approved').order('created_at',{ascending:false});if(cat==='realestate'){const {data}=await db.from('marketplace_categories').select('id,slug').in('slug',['realestate','land']).eq('is_active',true);const ids=(data||[]).map(x=>x.id);if(!ids.length){grid.innerHTML='<div class="empty">لا توجد فئات عقارية مفعلة حاليًا.</div>';return}q=q.in('category_id',ids)}else if(cat==='spare_parts'){const {data,error}=await db.from('marketplace_categories').select('id').eq('slug','spare_parts').eq('is_active',true).maybeSingle();if(error||!data){grid.innerHTML='<div class="empty">تعذر العثور على قسم قطع الغيار.</div>';return}q=q.eq('category_id',data.id);if(part)q=q.in('details->>part_category',aliases[part]||[part])}else if(cat!=='ads'){const {data,error}=await db.from('marketplace_categories').select('id').eq('slug',slugMap[cat]||'products').eq('is_active',true).maybeSingle();if(error||!data){grid.innerHTML='<div class="empty">تعذر العثور على هذا القسم.</div>';return}q=q.eq('category_id',data.id)}const {data,error}=await q;if(error){grid.innerHTML=`<div class="empty"><b>تعذر تحميل القسم.</b><br><small>${esc(error.message)}</small></div>`;return}let rows=(data||[]).filter(a=>!a.end_at||new Date(a.end_at).getTime()>Date.now());const search=document.getElementById('categorySearch')?.value.trim()||'';rows=applyLocalFilters(rows,search,loc,cat);document.getElementById('count').textContent=rows.length+' إعلان';grid.innerHTML=rows.length?rows.map(a=>renderCard(a,label,cat,loc)).join(''):`<div class="empty"><div><b>لا توجد إعلانات مطابقة حاليًا.</b><br><small>جرّب تغيير الموقع أو النطاق أو البحث.</small><br><a class="publish-link" style="display:inline-flex;margin-top:12px" href="./marketplace-publish.html?v=199">📢 انشر أول إعلان</a></div></div>`}
function setupFilters(){renderRecent();const input=document.getElementById('categorySearch');const run=()=>{const q=input.value.trim();if(q)saveRecent(q);loadCategory()};document.getElementById('openSearch')?.addEventListener('click',run);document.getElementById('filterSearch')?.addEventListener('click',run);input?.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.getElementById('filterCategories')?.addEventListener('click',()=>{location.href='marketplace.html#categories'});document.getElementById('filterPrice')?.addEventListener('click',()=>document.getElementById('pricePanel')?.classList.toggle('show'));['minPrice','maxPrice'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>loadCategory()));document.getElementById('filterLatest')?.addEventListener('click',()=>{document.getElementById('filterLatest').classList.toggle('active');loadCategory()})}
