<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FENK — إعلاناتي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#063d33;--g2:#087c5b;--line:#dbe9e4;--ink:#173c4c;--muted:#6d7d79}*{box-sizing:border-box}body{margin:0;background:#f5faf8;color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{width:min(900px,calc(100% - 18px));margin:auto}.top{height:54px;background:#032c25;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}.brand{font-weight:1000;font-size:17px}.brand span{color:#19d394}.back{color:#fff;text-decoration:none;border:1px solid #ffffff33;border-radius:10px;padding:8px 11px;font-size:11px}.hero{margin:12px 0;background:linear-gradient(135deg,#063d33,#087c5b);color:#fff;border-radius:18px;padding:17px}.hero h1{margin:0 0 5px;font-size:22px}.hero p{margin:0;font-size:10px;line-height:1.8;color:#dcf7ee}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;display:grid;grid-template-columns:100px 1fr;gap:11px}.card img{width:100px;height:80px;object-fit:cover;border-radius:10px;background:#eef5f2}.body h3{margin:0 0 5px;font-size:14px}.meta{font-size:10px;color:var(--muted);line-height:1.8}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.badge{border-radius:999px;padding:5px 8px;background:#eef5f2;color:#075d47;font-size:9px;font-weight:900}.badge.bad{background:#fff0f0;color:#a52828}.badge.wait{background:#fff7df;color:#775600}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions a,.actions button{border:1px solid #cfe0da;background:#fff;color:#075d47;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900;text-decoration:none}.actions .danger{color:#a52828;border-color:#efc0c0}.empty{background:#fff;border:1px dashed #cfe0da;border-radius:15px;padding:28px;text-align:center;color:var(--muted);font-size:11px}@media(max-width:520px){.card{grid-template-columns:1fr}.card img{width:100%;height:150px}.body h3{font-size:13px}}
</style><link rel="stylesheet" href="marketplace-mobile-unified.css">
  <link rel="stylesheet" href="fenk-global-share.css?v=1">
</head><body><header class="mp-header"><a class="mp-back" href="marketplace.html">← رجوع</a><a class="mp-brand" href="marketplace.html"><span>FENK</span> إعلاناتي</a><a class="mp-cart" href="product-cart.html" aria-label="السلة">🛒 <span class="mp-cart-count"></span></a></header><main class="wrap"><section class="hero"><h1>📋 إعلاناتي</h1><p>هنا ترى إعلاناتك ومسوداتك وحالات الدفع والمراجعة. لا يستطيع أي مستخدم آخر إدارة إعلاناتك.</p></section><div id="msg" class="empty">جارٍ تحميل إعلاناتك…</div><section id="list" class="list"></section></main><script>
const SUPABASE_URL='https://wqfnzahjwlukncxlxdkp.supabase.co',SUPABASE_KEY='sb_publishable__QR4tJ9p5RYOQkIuHkoYKQ_mbDa9tuA';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v||0).toLocaleString('ar-DZ')+' دج';
const status={draft:['مسودة','wait'],pending_payment:['بانتظار الدفع','wait'],payment_review:['مراجعة الدفع','wait'],pending_review:['قيد مراجعة المحتوى','wait'],approved:['مقبول ومنشور',''],rejected:['مرفوض','bad'],hidden:['مخفي','bad'],deleted:['محذوف','bad']};const pay={unpaid:'غير مدفوع',proof_uploaded:'تم رفع الإثبات',under_review:'قيد التحقق',paid:'تم التأكيد',not_required:'غير مطلوب — نشر مجاني',rejected:'مرفوض'};
async function notifyTelegram(event,id,snapshot){try{const {data:{session}}=await db.auth.getSession();if(!session?.access_token)return;await fetch(`${SUPABASE_URL}/functions/v1/marketplace-telegram-notify`,{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_KEY,Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({event,ad_id:id,snapshot})})}catch(e){}}
async function cleanup(row){const urls=Array.isArray(row.image_urls)?row.image_urls:(row.image_url?[row.image_url]:[]);const paths=urls.map(u=>{try{const m=new URL(u).pathname.match(/\/storage\/v1\/object\/public\/marketplace-images\/(.+)$/);return m?decodeURIComponent(m[1]):null}catch{return null}}).filter(Boolean);if(paths.length)await db.storage.from('marketplace-images').remove(paths);if(row.payment_proof_path)await db.storage.from('marketplace-payment-proofs').remove([row.payment_proof_path]);}
async function del(id){if(!confirm('هل أنت متأكد من حذف هذا الإعلان؟'))return;const {data:row,error:r}=await db.from('marketplace_ads').select('id,ad_code,user_id,title,image_url,image_urls,payment_proof_path,details,wilaya,municipality,price_dzd,payment_status,status').eq('id',id).maybeSingle();if(r||!row){alert('الإعلان غير موجود.');return}const {error}=await db.from('marketplace_ads').delete().eq('id',id);if(error){alert('تعذر الحذف: '+error.message);return}await cleanup(row);await notifyTelegram('deleted',id,row);load();}
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){$('msg').innerHTML='يجب تسجيل الدخول أولًا.<br><a href="index.html">العودة إلى FENK</a>';return}const {data,error}=await db.from('marketplace_ads').select('id,ad_code,title,description,price_dzd,image_url,image_urls,status,payment_status,created_at,wilaya,wilaya_code,municipality,commune,details,payment_proof_path').eq('user_id',session.user.id).order('created_at',{ascending:false});if(error){$('msg').textContent='تعذر تحميل إعلاناتك: '+error.message;return}if(!data?.length){$('msg').innerHTML='📢 <b>لا توجد إعلانات بعد</b><br><span>ابدأ الآن بنشر أول إعلان لك.</span><br><a class="publish-link" href="marketplace-publish.html?v=199">+ نشر إعلان جديد</a>';return}$('msg').style.display='none';$('list').innerHTML=data.map(a=>{const urls=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls:(a.image_url?[a.image_url]:[]),st=status[a.status]||[a.status,'wait'];return `<article class="card">${urls[0]?`<img src="${esc(urls[0])}" alt="" loading="lazy">`:''}<div class="body"><h3>${esc(a.title)}</h3><div class="meta">🆔 ${esc(a.ad_code||a.id)}<br>${a.price_dzd!=null?'💰 '+money(a.price_dzd)+'<br>':''}${a.wilaya?'📍 '+esc(a.wilaya)+(a.wilaya_code?' ('+esc(a.wilaya_code)+')':'')+'<br>':''}${a.municipality||a.commune?'🏘️ '+esc(a.municipality||a.commune)+'<br>':''}📅 ${new Date(a.created_at).toLocaleDateString('ar-DZ')}</div><div class="badges"><span class="badge ${st[1]}">الإعلان: ${esc(st[0])}</span><span class="badge ${a.payment_status==='rejected'?'bad':a.payment_status==='paid'?'':'wait'}">الدفع: ${esc(pay[a.payment_status]||a.payment_status)}</span></div><div class="actions">${a.status==='approved'?`<a href="marketplace-ad.html?id=${encodeURIComponent(a.id)}">عرض الإعلان</a>`:''}${a.status==='draft'?`<a href="marketplace-publish.html?draft=${encodeURIComponent(a.id)}">↩️ متابعة المسودة</a>`:''}<button class="danger" type="button" onclick="del('${esc(a.id)}')">🗑️ حذف الإعلان</button></div></div></article>`}).join('')}
load();
</script><script src="marketplace-cart-header.js"></script>
  <script src="fenk-global-share.js?v=1"></script>
</body></html>
