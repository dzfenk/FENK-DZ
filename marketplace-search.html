<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FENK — بحث في Marketplace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#063d33;--g2:#087c5b;--line:#dbe9e4;--ink:#173c4c;--muted:#6d7d79}*{box-sizing:border-box}body{margin:0;background:#f5faf8;color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}a{text-decoration:none;color:inherit}.top{height:54px;background:#032c25;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{font-weight:1000;font-size:18px}.brand span{color:#19d394}.back{border:1px solid #ffffff33;border-radius:10px;padding:8px 11px;font-size:11px}.wrap{width:min(980px,calc(100% - 18px));margin:12px auto}.searchbox{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;display:flex;gap:8px;box-shadow:0 8px 25px rgba(6,61,51,.06)}input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;padding:10px}button,.go{border:0;background:linear-gradient(135deg,#0b9a6b,#087c5b);color:#fff;border-radius:11px;padding:10px 15px;font-weight:900;cursor:pointer}.section{margin-top:14px}.section h2{font-size:16px;margin:0 0 8px}.recent{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px}.recent-list{display:flex;flex-wrap:wrap;gap:7px}.recent-item{display:inline-flex;align-items:center;gap:3px;background:#f5faf8;border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px}.recent-item button{background:transparent;color:#71817d;padding:0 3px;font-size:16px;line-height:1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover}.body{padding:7px}.body h3{font-size:11px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:10px;color:#075d47;font-weight:1000;margin-top:5px}.loc{font-size:8px;color:#71817d;margin-top:4px}.empty{background:#fff;border:1px dashed #cfe0da;border-radius:15px;text-align:center;padding:30px;color:var(--muted);font-size:11px}@media(max-width:5 </head><body><header class="top"><a class="back" href="marketplace.html">← رجوع</a><div class="brand"><span>FENK</span> Marketplace</div><span style="width:64px"></span></header><main class="wrap"><section><h1 style="font-size:24px;margin:8px 0 5px">بحث في Marketplace</h1><p style="font-size:11px;color:#6d7d79;margin:0 0 12px">ابحث بالعربية أو الفرنسية أو الدارجة، حتى مع بعض الأخطاء الإملائية.</p><div class="searchbox"><input id="q" type="search" placeholder="ما الذي تريد شراءه؟" autocomplete="off"><button id="go">بحث</button></div></section><section class="section recent" id="recentBox"><h2>عمليات البحث الأخيرة</h2><div class="recent-list" id="recent"></div></section><section class="section"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0">نتائج البحث</h2><small id="count" style="color:#71817d"></small></div><div class="grid" id="results"><div class="empty">اكتب ما تبحث عنه ثم اضغط «بحث».</div></div></section></main><script>
const URL='https://wqfnzahjwlukncxlxdkp.supabase.co',KEY='sb_publishable__QR4tJ9p5RYOQkIuHkoYKQ_mbDa9tuA',db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true}}),RKEY='fenk_marketplace_recent_searches_v1';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const norm=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim();function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let j=1;j<=a.length;j++){let p=j;for(let i=1;i<=b.length;i++){const c=d[i];d[i]=Math.min(d[i]+1,d[i-1]+1,p+(a[j-1]===b[i-1]?0:1));p=c}}return d[b.length]}function match(q,t){q=norm(q);t=norm(t);if(!q||t.includes(q))return true;return q.split(' ').filter(Boolean).every(w=>t.split(' ').some(x=>x.includes(w)||lev(w,x)<=Math.max(1,Math.floor(w.length*.3))))}function recent(){try{return JSON.parse(localStorage.getItem(RKEY)||'[]')}catch{return[]}}function renderRecent(){const a=recent(),box=document.getElementById('recentBox');document.getElementById('recent').innerHTML=a.length?a.map(x=>`<span class="recent-item"><button data-x="${esc(x)}">×</button><button style="border:0;background:transparent;color:#173c4c;padding:0" data-q="${esc(x)}">${esc(x)}</button></span>`).join(''):'<span style="font-size:10px;color:#71817d">ابدأ بحثًا ليظهر هنا تلقائيًا.</span>';box.hidden=!a.length;box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{localStorage.setItem(RKEY,JSON.stringify(recent().filter(x=>x!==b.dataset.x)));renderRecent()});box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.getElementById('q').value=b.dataset.q;run()})}function save(q){let a=recent().filter(x=>norm(x)!==norm(q));a.unshift(q);localStorage.setItem(RKEY,JSON.stringify(a.slice(0,8)));renderRecent()}async function run(){const q=document.getElementById('q').value.trim();if(!q){document.getElementById('results').innerHTML='<div class="empty">اكتب ما تريد البحث عنه.</div>';return}save(q);document.getElementById('results').innerHTML='<div class="empty">جارٍ البحث…</div>';const {data,error}=await db.from('marketplace_ads').select('id,title,description,price_dzd,image_url,image_urls,wilaya,municipality,commune,details,created_at').eq('status','approved').order('created_at',{ascending:false});if(error){document.getElementById('results').innerHTML='<div class="empty">تعذر تحميل نتائج البحث.</div>';return}const rows=(data||[]).filter(a=>match(q,[a.title,a.description,a.wilaya,a.municipality,a.commune,JSON.stringify(a.details||{})].join(' ')));document.getElementById('count').textContent=rows.length+' نتيجة';document.getElementById('results').innerHTML=rows.length?rows.map(a=>{const u=Array.isArray(a.image_urls)&&a.image_urls.length?a.image_urls[0]:a.image_url;return `<a class="card" href="marketplace-ad.html?id=${encodeURIComponent(a.id)}">${u?`<img src="${esc(u)}" loading="lazy">`:'<div style="aspect-ratio:1/1;display:grid;place-items:center;background:#eaf8f3">📷</div>'}<div class="body"><h3>${esc(a.title)}</h3><div class="price">${a.price_dzd&&Number(a.price_dzd)>0?Number(a.price_dzd).toLocaleString('ar-DZ')+' دج':'السعر عند التواصل'}</div><div class="loc">📍 ${esc(a.wilaya||a.municipality||a.commune||'الموقع غير محدد')}</div></div></a>`}).join(''):'<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى أو صيغة مختلفة.</div>'}document.getElementById('go').onclick=run;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});renderRecent();const initial=new URLSearchParams(location.search).get('q');if(initial){document.getElementById('q').value=initial;run()}
</script>  <script src="fenk-global-share.js?v=1"></script>
